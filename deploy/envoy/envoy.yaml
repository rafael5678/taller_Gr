static_resources:
  listeners:
    - name: rest_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: voltbarrio_rest
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: voltbarrio
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: medicion_grpc
                            timeout: 15s
                          request_headers_to_add:
                            - header:
                                key: x-voltbarrio-role
                                value: neighbor
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/descriptor.pb
                      services:
                        - voltbarrio.v1.MeasurementService
                      print_options:
                        preserve_proto_field_names: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: medicion_grpc
      type: STRICT_DNS
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: medicion_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: medicion
                      port_value: 9090
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: medicion
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/envoy/certs/envoy.pem
                private_key:
                  filename: /etc/envoy/certs/envoy-key.pem
            validation_context:
              trusted_ca:
                filename: /etc/envoy/certs/ca.pem
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: medicion
admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
